

[package]

name = "z-tokens-runtime"

workspace = "../workspace"

autobins = false
autoexamples = false
autotests = false
autobenches = false

version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true




[lib]

name = "z_tokens_runtime"
path = "./lib.rs"




[features]

default = []

development = []

release = []

zt-runtime-allocator = []

zt-runtime-do-not-enable-this = []




[dependencies]

vrl-errors = { version = "*", optional = false, default-features = false, features = [] }
vrl-preludes = { version = "*", optional = false, default-features = false, features = [] }

constant_time_eq = { version = "*", optional = false, default-features = false, features = [] }
byteorder = { version = "*", optional = false, default-features = false, features = [] }
zeroize = { version = "*", optional = false, default-features = false, features = ["std", "alloc"] }

num-bigint = { version = "*", optional = false, default-features = false, features = ["std"] }
num-integer = { version = "*", optional = false, default-features = false, features = ["std"] }
num-traits = { version = "*", optional = false, default-features = false, features = ["std"] }

chrono = { version = "*", optional = false, default-features = false, features = ["alloc", "clock"] }
platform-info = { version = "*", optional = false, default-features = false, features = [] }

paste = { version = "*", optional = false, default-features = false, features = [] }
const_format = { version = "*", optional = false, default-features = false, features = [] }

[target.'cfg( not( target_family = "wasm" ) )'.dependencies]
memsec = { version = "*", optional = false, default-features = false, features = ["default"] }

[target.'cfg( target_family = "wasm" )'.dependencies]
memsec = { version = "*", optional = true, default-features = false, features = ["default"] }


